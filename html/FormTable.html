<!doctype html>
<html>
  <head>
    <base target="_top" />
    <title>BOM Table Parser</title>
    <!-- 🔥 ОБОВ'ЯЗКОВО -->
    <style>
      textarea {
        width: 100%;
        height: 200px;
      }
      input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h3>Створити BOM (Table Parser V1)</h3>

    <label>Parent Code:</label>
    <input id="parentCode" value="Каркас плоский; КР1-2-149" />

    <label>Table Input:</label>
    <textarea id="tableInput">
Арматура; ø6 А500С; L=130 ; 6
Арматура; ø6 А500С; L=1 180 ; 1
Стержень гнутий; ГСк-1; 1 
Арматура; ø14 А500С; L=1 160; 1 



    </textarea>

    <button onclick="submit()">Створити BOM</button>

    <script>
      function submit() {
        const parentCode = document.getElementById('parentCode').value;
        const text = document.getElementById('tableInput').value;

        google.script.run
          .withSuccessHandler((res) => alert('OK: ' + res))
          .runTableParser(parentCode, text);
      }
    </script>
  </body>
</html>
