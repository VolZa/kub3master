<!doctype html>
<html>
  <head>
    <base target="_top" />
    <title>BOM Table Parser</title>
    <!-- 🔥 ОБОВ'ЯЗКОВО -->
    <style>
      textarea {
        width: 100%;
        height: 200px;
      }
      input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h3>Створити BOM (Table Parser V1)</h3>
    <label>Project Document ID:</label>
    <input id="projectDocumentId" value="7" />

    <label>Parent Code:</label>
    <input id="parentCode" value="Плита міжколонна; П-2.7" />

    <label>Table Input:</label>
    <textarea id="tableInput">
Каркас просторовий; КП-1; 7
Сітка; ВСП-П-2.7; (верхня); 1
Сітка; СП-П-2.7; (нижня);  1
Стержень гнутий; ГС-0; 4
Стержень гнутий; ГС-2; 32
Стержень гнутий; ГС-2.3; 2
Стержень гнутий; ГС-3; 8
Стержень гнутий; ОС-1; 12
Закладна деталь; ЗД-1; 4
Бетон; С 20/25, м3;  1,365 

    </textarea>

    <button onclick="submit()">Створити BOM</button>

    <script>
      function submit() {
        const projectDocumentId =
          document.getElementById('projectDocumentId').value;

        const parentCode = document.getElementById('parentCode').value;

        const text = document.getElementById('tableInput').value;

        google.script.run
          .withSuccessHandler((res) => alert('OK: ' + res))
          .runTableParser(projectDocumentId, parentCode, text);
      }
    </script>
  </body>
</html>
