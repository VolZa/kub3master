<!doctype html>
<html>
  <head>
    <base target="_top" />
    <title>BOM Table Parser</title>
    <!-- 🔥 ОБОВ'ЯЗКОВО -->
    <style>
      textarea {
        width: 100%;
        height: 200px;
      }
      input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h3>Створити BOM (Table Parser V1)</h3>

    <label>Parent Code:</label>
    <input id="parentCode" value="Плита надколонна; П-1.1" />

    <label>Table Input:</label>
    <textarea id="tableInput">
Виріб закладний; МК-1; 1 
Каркас просторовий; КП-1; 6 
Сітка; ВСП-П-1.1; (верхня); 1 
Сітка; СП-П-1.1; (нижня) ; 1
Стержень гнутий; ГС-0 ; 4
Стержень гнутий; ГС-2 ; 24
Стержень гнутий; ГС-3 ; 8
Бетон; С 20/25, м3; 1.341 

    </textarea>

    <button onclick="submit()">Створити BOM</button>

    <script>
      function submit() {
        const parentCode = document.getElementById('parentCode').value;
        const text = document.getElementById('tableInput').value;

        google.script.run
          .withSuccessHandler((res) => alert('OK: ' + res))
          .runTableParser(parentCode, text);
      }
    </script>
  </body>
</html>
