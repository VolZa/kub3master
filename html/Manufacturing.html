<!doctype html>
<html>
  <head>
    <base target="_top" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ERP КУБ</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12px;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
      }

      .container {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 16px;
        background: #ffffff;
        border-radius: 12px;
      }

      /* ======================================================
         Навігація режимів
         ====================================================== */

      .mode-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        border-bottom: 1px solid #d1d5db;
      }

      .mode-tab {
        flex: 1;
        min-height: 44px;
        padding: 8px 6px;
        border: none;
        border-radius: 8px 8px 0 0;
        background: transparent;
        color: #6b7280;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .mode-tab.active {
        color: #1d4ed8;
        background: #eff6ff;
        border-bottom: 3px solid #2563eb;
      }

      .mode-tab:not(.active):hover {
        background: #f3f4f6;
      }

      /* ======================================================
         Заголовки
         ====================================================== */

      h2 {
        margin: 0 0 4px 0;
        font-size: 22px;
      }

      .subtitle {
        margin: 0 0 18px 0;
        color: #6b7280;
        font-size: 14px;
      }

      /* ======================================================
         Поля
         ====================================================== */

      .field {
        margin-bottom: 14px;
      }

      .loss-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .loss-grid input {
        min-width: 0;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: 600;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        font-size: 16px;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #2563eb;
      }

      /* ======================================================
         Кнопка
         ====================================================== */

      .button {
        width: 100%;
        min-height: 50px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: #16a34a;
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
      }

      .button:active {
        transform: scale(0.99);
      }

      /* ======================================================
         Заглушки для майбутніх режимів
         ====================================================== */

      .placeholder {
        padding: 24px 12px;
        text-align: center;
        color: #6b7280;
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- ====================================================
           НАВІГАЦІЯ
           ==================================================== -->

      <div class="mode-tabs">
        <button
          id="manufacturingTab"
          class="mode-tab active"
          type="button"
          onclick="showManufacturingMode()"
        >
          Виготовлення
        </button>

        <button
          id="reportTab"
          class="mode-tab"
          type="button"
          onclick="showReportMode()"
        >
          Звіт
        </button>

        <button
          id="planTab"
          class="mode-tab"
          type="button"
          onclick="showPlanMode()"
        >
          План
        </button>
      </div>

      <!-- ====================================================
           РЕЖИМ: ВИГОТОВЛЕННЯ
           ==================================================== -->

      <div id="manufacturingView">
        <h2>Виготовлення</h2>

        <p class="subtitle">Внесення факту виготовлення продукції</p>

        <div class="field">
          <label for="date">Дата</label>
          <input id="date" type="date" />
        </div>

        <div class="field">
          <label for="shift">Зміна</label>

          <select id="shift">
            <option value="">Оберіть зміну</option>
            <option value="1">1 зміна</option>
            <option value="2">2 зміна</option>
          </select>
        </div>

        <div class="field">
          <label for="houseCode">Будинок</label>

          <select id="houseCode" onchange="handleHouseChange()">
            <option value="">Завантаження...</option>
          </select>
        </div>

        <div class="field">
          <label for="productCode">Код виробу</label>

          <input id="productCode" type="text" placeholder="Наприклад, П-2.2" />
        </div>

        <div class="field">
          <label for="quantity">Кількість</label>

          <input id="quantity" type="number" min="1" step="1" value="1" />
        </div>

        <div class="field">
          <label for="placementId">Позиція</label>

          <select id="placementId">
            <option value="">NONE — поза проектом</option>
          </select>
        </div>

        <div class="field">
          <label for="master">Майстер</label>

          <input id="master" type="text" placeholder="Прізвище та ім'я" />
        </div>

        <div class="field">
          <label for="comment">Примітка</label>

          <textarea id="comment" placeholder="Необов'язково"></textarea>
        </div>

        <button class="button" type="button" onclick="acceptManufacturing()">
          ✓ ПРИЙНЯТИ
        </button>
      </div>

      <!-- ====================================================
           РЕЖИМ: ЗВІТ
           ==================================================== -->

      <div id="reportView" class="view" style="display: none">
        <h2>Звіт</h2>
        <p class="subtitle">Виробничі звіти</p>

        <div class="field">
          <label for="reportHouseCode">Будинок</label>
          <select id="reportHouseCode" onchange="handleReportHouseChange()">
            <option value="">Усі будинки</option>
          </select>
        </div>

        <div class="field">
          <label for="reportProductCode">Виріб</label>
          <select id="reportProductCode" disabled>
            <option value="">Усі вироби</option>
          </select>
        </div>

        <div class="field">
          <label>Період</label>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div>
              <input id="reportDateFrom" type="date" />
              <small>від</small>
            </div>

            <div>
              <input id="reportDateTo" type="date" />
              <small>до</small>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="reportType">Тип звіту</label>

          <select id="reportType">
            <option value="material-consumption">Витрата матеріалів</option>
          </select>
        </div>

        <div class="field">
          <label for="reportCalculationMethod"> Метод розрахунку </label>

          <select
            id="reportCalculationMethod"
            onchange="handleReportCalculationMethodChange()"
          >
            <option value="normative">Нормативна</option>
            <option value="batch-based" disabled>Batch-based — ще не реалізовано</option>
          </select>
        </div>

        <p class="subtitle">Нормативні втрати, %</p>
        <div class="loss-grid">
          <div>
            <label for="lossRebar">Арматура</label>
            <input id="lossRebar" type="number" min="0" max="100" step="any" required />
          </div>
          <div>
            <label for="lossRolled">Прокат</label>
            <input id="lossRolled" type="number" min="0" max="100" step="any" required />
          </div>
          <div>
            <label for="lossConcrete">Бетон</label>
            <input id="lossConcrete" type="number" min="0" max="100" step="any" required />
          </div>
        </div>

        <div class="field">
          <label for="reportFormat">Формат</label>

          <select id="reportFormat">
            <option value="google-sheet">Google Sheet</option>
          </select>
        </div>

        <button id="generateReportButton" class="button" type="button" onclick="buildReportWebInput()" disabled>
          ✓ СФОРМУВАТИ
        </button>

        <p id="reportStatus" role="status" aria-live="polite"></p>
        <a id="reportLink" target="_blank" rel="noopener noreferrer" hidden>ВІДКРИТИ ЗВІТ</a>
        <button id="saveReportButton" class="button" type="button" onclick="saveCurrentMaterialReport()" disabled>ЗБЕРЕГТИ ЗВІТ</button>
        <p id="saveReportStatus" role="status" aria-live="polite"></p>
        <a id="savedReportLink" target="_blank" rel="noopener noreferrer" hidden>ВІДКРИТИ ЗБЕРЕЖЕНИЙ ЗВІТ</a>
        <h3>Збережені звіти</h3>
        <button id="refreshArchiveButton" type="button" onclick="refreshSavedReports()">ОНОВИТИ СПИСОК</button>
        <p id="archiveStatus" role="status" aria-live="polite"></p>
        <div style="overflow-x: auto">
          <table><thead><tr><th>Назва звіту</th><th>Будинок</th><th>Виріб</th><th>Період</th><th>Дата збереження</th><th>Дії</th></tr></thead>
          <tbody id="savedReportsBody"></tbody></table>
        </div>
        <div
          id="reportDebug"
          style="
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f4f6;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
          "
        ></div>
      </div>

      <!-- ====================================================
           РЕЖИМ: ПЛАН
           ==================================================== -->

      <div id="planView" style="display: none">
        <h2>План</h2>

        <p class="subtitle">Планування виробництва</p>

        <div class="placeholder">
          Форма планування буде додана на наступному етапі.
        </div>
      </div>
    </div>

    <!-- ======================================================
         JAVASCRIPT
         ====================================================== -->

    <script>
      setActiveMode('manufacturing');
      // ======================================================
      // Перемикання режимів
      // ======================================================

      function setActiveMode(mode) {
        const views = {
          manufacturing: 'manufacturingView',
          report: 'reportView',
          plan: 'planView',
        };

        const tabs = {
          manufacturing: 'manufacturingTab',
          report: 'reportTab',
          plan: 'planTab',
        };

        for (const key in views) {
          document.getElementById(views[key]).style.display =
            key === mode ? '' : 'none';

          document
            .getElementById(tabs[key])
            .classList.toggle('active', key === mode);
        }
      }

      function showManufacturingMode() {
        setActiveMode('manufacturing');
      }

      function showReportMode() {
        setActiveMode('report');
      }

      function showPlanMode() {
        setActiveMode('plan');
      }

      // ======================================================
      // ВИГОТОВЛЕННЯ
      // ======================================================

      function loadHouseOptions() {
        google.script.run

          .withSuccessHandler((options) => {
            const select = document.getElementById('houseCode');

            select.innerHTML = '';

            for (const option of options) {
              const element = document.createElement('option');

              element.value = option.value;
              element.textContent = option.label;

              select.appendChild(element);
            }

            handleHouseChange();
          })

          .withFailureHandler((error) => {
            alert('Помилка завантаження будинків: ' + error.message);
          })

          .getManufacturingHouseOptions();
      }

      function resetPlacement() {
        const placementSelect = document.getElementById('placementId');

        placementSelect.innerHTML = '';

        const option = document.createElement('option');

        option.value = '';
        option.textContent = 'NONE — поза проектом';

        placementSelect.appendChild(option);
      }

      function handleHouseChange() {
        const houseCode = document.getElementById('houseCode').value;

        resetPlacement();

        const currentProductElement = document.getElementById('productCode');

        // ----------------------------------------------------
        // NONE — ручний ввід ProductCode
        // ----------------------------------------------------

        if (houseCode === '') {
          const input = document.createElement('input');

          input.id = 'productCode';
          input.type = 'text';
          input.placeholder = 'Наприклад, П-2.2';

          currentProductElement.replaceWith(input);

          return;
        }

        // ----------------------------------------------------
        // Конкретний будинок
        // ----------------------------------------------------

        const select = document.createElement('select');

        select.id = 'productCode';
        select.onchange = handleProductChange;

        const loadingOption = document.createElement('option');

        loadingOption.value = '';
        loadingOption.textContent = 'Завантаження виробів...';

        select.appendChild(loadingOption);

        currentProductElement.replaceWith(select);

        google.script.run

          .withSuccessHandler((options) => {
            select.innerHTML = '';

            const emptyOption = document.createElement('option');

            emptyOption.value = '';
            emptyOption.textContent = 'Оберіть виріб';

            select.appendChild(emptyOption);

            for (const option of options) {
              const element = document.createElement('option');

              element.value = option.value;
              element.textContent = option.label;

              select.appendChild(element);
            }
          })

          .withFailureHandler((error) => {
            alert('Помилка завантаження виробів: ' + error.message);
          })

          .getManufacturingProductOptions(houseCode);
      }

      function handleProductChange() {
        const houseCode = document.getElementById('houseCode').value;

        const productCode = document.getElementById('productCode').value;

        resetPlacement();

        if (houseCode === '' || productCode === '') {
          return;
        }

        const placementSelect = document.getElementById('placementId');

        const loadingOption = document.createElement('option');

        loadingOption.value = '';
        loadingOption.textContent = 'Завантаження позицій...';

        placementSelect.appendChild(loadingOption);

        google.script.run

          .withSuccessHandler((options) => {
            placementSelect.innerHTML = '';

            const emptyOption = document.createElement('option');

            emptyOption.value = '';
            emptyOption.textContent = 'Оберіть позицію';

            placementSelect.appendChild(emptyOption);

            for (const option of options) {
              const element = document.createElement('option');

              element.value = option.value;
              element.textContent = option.label;

              placementSelect.appendChild(element);
            }
          })

          .withFailureHandler((error) => {
            alert('Помилка завантаження позицій: ' + error.message);
          })

          .getManufacturingPlacementOptions(houseCode, productCode);
      }

      function acceptManufacturing() {
        const webInput = {
          date: document.getElementById('date').value,

          shift: document.getElementById('shift').value,

          houseCode: document.getElementById('houseCode').value,

          productCode: document.getElementById('productCode').value,

          quantity: Number(document.getElementById('quantity').value),

          placementId:
            document.getElementById('placementId').value === ''
              ? undefined
              : Number(document.getElementById('placementId').value),

          master: document.getElementById('master').value,

          comment: document.getElementById('comment').value,
        };

        google.script.run

          .withSuccessHandler((manufacturingId) => {
            alert(`Manufacturing ${manufacturingId} створений.`);
          })

          .withFailureHandler((error) => {
            alert('Помилка: ' + error.message);
          })

          .createManufacturingFromWeb(webInput);
      }

      // ======================================================
      // Початкове завантаження
      // ======================================================

      loadHouseOptions();

      // ============================================================
      // REPORT
      // ============================================================

      //   function loadReportHouseOptions() {
      //     google.script.run
      //       .withSuccessHandler((options) => {
      //         const select = document.getElementById('reportHouseCode');

      //         select.innerHTML = '';

      //         const allOption = document.createElement('option');
      //         allOption.value = '';
      //         allOption.textContent = 'Усі будинки';

      //         select.appendChild(allOption);

      //         for (const option of options) {
      //           const element = document.createElement('option');

      //           element.value = option.value;
      //           element.textContent = option.label;

      //           select.appendChild(element);
      //         }

      //         resetReportProductOptions();
      //       })
      //       .withFailureHandler((error) => {
      //         alert('Помилка завантаження будинків для звіту: ' + error.message);
      //       })
      //       .getManufacturingHouseOptions();
      //   }
      function loadReportHouseOptions() {
        reportHousesLoading = true;
        reportOptionsError = false;
        document.getElementById('reportHouseCode').disabled = true;
        updateReportButton();
        google.script.run
          .withSuccessHandler((options) => {
            console.log('REPORT house options:', options);

            const select = document.getElementById('reportHouseCode');

            console.log('REPORT house select:', select);

            select.innerHTML = '';

            const allOption = document.createElement('option');
            allOption.value = '';
            allOption.textContent = 'Усі будинки';

            select.appendChild(allOption);

            for (const option of options) {
              console.log('REPORT house option:', option);

              const element = document.createElement('option');

              element.value = option.value;
              element.textContent = option.label;

              select.appendChild(element);
            }

            console.log('REPORT house select options:', select.options.length);

            resetReportProductOptions();
            reportHousesLoading = false;
            select.disabled = false;
            updateReportButton();
          })
          .withFailureHandler((error) => {
            reportHousesLoading = false;
            reportOptionsError = true;
            updateReportButton();
            console.error('REPORT house options error:', error);

            alert('Помилка завантаження будинків для звіту: ' + error.message);
          })
          .getManufacturingHouseOptions();
      }
      function resetReportProductOptions() {
        const select = document.getElementById('reportProductCode');

        select.innerHTML = '';

        const allOption = document.createElement('option');

        allOption.value = '';
        allOption.textContent = 'Усі вироби';

        select.appendChild(allOption);

        select.disabled = true;
      }

      function handleReportHouseChange() {
        const requestId = ++reportProductRequestId;
        const houseCode = document.getElementById('reportHouseCode').value;

        const productSelect = document.getElementById('reportProductCode');

        resetReportProductOptions();
        reportProductsLoading = false;
        reportOptionsError = false;

        if (houseCode === '') {
          updateReportButton();
          return;
        }

        productSelect.disabled = true;
        reportProductsLoading = true;
        updateReportButton();

        const loadingOption = document.createElement('option');

        loadingOption.value = '';
        loadingOption.textContent = 'Завантаження виробів...';

        productSelect.innerHTML = '';
        productSelect.appendChild(loadingOption);

        google.script.run
          .withSuccessHandler((options) => {
            if (requestId !== reportProductRequestId || document.getElementById('reportHouseCode').value !== houseCode) return;
            productSelect.innerHTML = '';

            const allOption = document.createElement('option');

            allOption.value = '';
            allOption.textContent = 'Усі вироби';

            productSelect.appendChild(allOption);

            for (const option of options) {
              const element = document.createElement('option');

              element.value = option.value;
              element.textContent = option.label;

              productSelect.appendChild(element);
            }

            productSelect.disabled = false;
            reportProductsLoading = false;
            updateReportButton();
          })
          .withFailureHandler((error) => {
            if (requestId !== reportProductRequestId || document.getElementById('reportHouseCode').value !== houseCode) return;
            resetReportProductOptions();
            reportProductsLoading = false;
            reportOptionsError = true;
            updateReportButton();

            alert('Помилка завантаження виробів для звіту: ' + error.message);
          })
          .getManufacturingProductOptions(houseCode);
      }

      function handleReportCalculationMethodChange() {
        const method = document.getElementById('reportCalculationMethod').value;

        const lossInputs = ['lossRebar', 'lossRolled', 'lossConcrete'].map(
          (id) => document.getElementById(id),
        );

        if (method === 'normative') {
          lossInputs.forEach((input) => { input.disabled = false; });
          return;
        }

        if (method === 'batch-based') {
          lossInputs.forEach((input) => { input.disabled = false; });
        }
      }

      function buildReportWebInput() {
        if (reportSubmitting || saveReportSubmitting || reportHousesLoading || reportProductsLoading || reportOptionsError) return;
        const houseCode = document.getElementById('reportHouseCode').value;

        const productCode = document.getElementById('reportProductCode').value;

        const dateFrom = document.getElementById('reportDateFrom').value;

        const dateTo = document.getElementById('reportDateTo').value;

        const reportType = document.getElementById('reportType').value;

        const calculationMethod = document.getElementById(
          'reportCalculationMethod',
        ).value;
        if (calculationMethod !== 'normative') {
          alert('NOT_IMPLEMENTED: підтримується лише нормативний метод.');
          return;
        }

        const lossPercents = {};
        for (const [group, id, label] of [
          ['rebar', 'lossRebar', 'Арматура'],
          ['rolled', 'lossRolled', 'Прокат'],
          ['concrete', 'lossConcrete', 'Бетон'],
        ]) {
          const raw = document.getElementById(id).value.trim();
          const value = Number(raw);
          if (raw === '' || !Number.isFinite(value) || value < 0 || value > 100) {
            alert(`${label}: вкажіть відсоток втрат від 0 до 100 (0 — без втрат).`);
            return;
          }
          lossPercents[group] = value;
        }

        const format = document.getElementById('reportFormat').value;

        if (dateFrom && dateTo && dateFrom > dateTo) {
          alert(
            'Дата початку періоду не може бути пізнішою за дату завершення.',
          );

          return;
        }

        const webInput = {
          houseCode: houseCode || undefined,
          productCode: productCode || undefined,

          dateFrom: dateFrom || undefined,
          dateTo: dateTo || undefined,

          reportType,

          calculationMethod,

          lossPercents,

          format,
        };

        reportSubmitting = true;
        ++reportStateRequest;
        updateSaveReportButton();
        updateReportButton();
        const status = document.getElementById('reportStatus');
        const link = document.getElementById('reportLink');
        link.hidden = true;
        link.removeAttribute('href');
        status.textContent = 'Формування звіту...';
        const finish = () => { reportSubmitting = false; updateReportButton(); updateSaveReportButton(); };
        const unknown = () => {
          finish();
          status.textContent = 'Результат невизначений. Перевірте REPORTING перед новим запуском. Автоматичного повтору немає.';
        };
        let settled = false;
        const timeout = setTimeout(() => { settled = true; unknown(); }, 360000);
        try {
        google.script.run
          .withSuccessHandler((result) => {
            clearTimeout(timeout);
            if (settled) return;
            settled = true;
            finish();
            if (result && result.status === 'OK' && /^https:\/\/docs\.google\.com\/spreadsheets\/d\/1Vy--GaVoUdP17Yd2PztUtXAcaf1krskxm5qvidQsoPc\/edit#gid=\d+$/.test(result.url)) {
              status.textContent = 'Звіт успішно сформовано.';
              if (result.cleanup === 'WARNING') {
                status.textContent += ' Потрібна перевірка службового аркуша REPORTING після cleanup. Повторне формування не потрібне.';
              }
              link.href = result.url;
              link.hidden = false;
              currentReportSheetId = result.sheetId;
              updateSaveReportButton();
            } else if (result && result.status === 'EMPTY') {
              status.textContent = 'За вибраними параметрами немає виготовлених виробів.';
            } else if (result && result.status === 'ERROR') {
              status.textContent = `${result.code}: ${result.message}`;
            } else unknown();
          })
          .withFailureHandler(() => {
            clearTimeout(timeout);
            if (settled) return;
            settled = true;
            unknown();
          })
          .generateMaterialConsumptionReportWeb(webInput);
        } catch (error) {
          clearTimeout(timeout);
          settled = true;
          unknown();
        }
      }

      // ============================================================
      // INITIALIZATION
      // ============================================================

      loadHouseOptions();
      let reportHousesLoading = true;
      let reportProductsLoading = false;
      let reportOptionsError = false;
      let reportSubmitting = false;
      let currentReportSheetId;
      let saveReportSubmitting = false;
      let reportStateRequest = 0;
      let reportProductRequestId = 0;
      function updateReportButton() {
        document.getElementById('generateReportButton').disabled = reportSubmitting || saveReportSubmitting || reportHousesLoading || reportProductsLoading || reportOptionsError;
      }
      loadReportHouseOptions();
      function updateSaveReportButton() {
        document.getElementById('saveReportButton').disabled = saveReportSubmitting || reportSubmitting || !Number.isSafeInteger(currentReportSheetId);
      }
      function loadCurrentReportState() {
        const request = ++reportStateRequest;
        google.script.run.withSuccessHandler((result) => {
          if (request !== reportStateRequest) return;
          currentReportSheetId = result && result.status === 'OK' ? result.sheetId : undefined;
          updateSaveReportButton();
          if (result && result.status === 'ERROR') document.getElementById('saveReportStatus').textContent = `${result.code}: ${result.message || 'Стан звіту недоступний.'}`;
        }).withFailureHandler(() => {
          if (request !== reportStateRequest) return;
          currentReportSheetId = undefined; updateSaveReportButton();
          document.getElementById('saveReportStatus').textContent = 'Не вдалося завантажити стан поточного звіту.';
        }).getCurrentMaterialReportWeb();
      }
      function saveCurrentMaterialReport() {
        if (saveReportSubmitting || reportSubmitting || !Number.isSafeInteger(currentReportSheetId)) return;
        const sourceSheetId = currentReportSheetId;
        saveReportSubmitting = true; updateSaveReportButton(); updateReportButton();
        const status = document.getElementById('saveReportStatus');
        const link = document.getElementById('savedReportLink');
        link.hidden = true;
        status.textContent = 'Збереження звіту...';
        let settled = false;
        const finish = () => { saveReportSubmitting = false; updateSaveReportButton(); updateReportButton(); };
        const unknown = () => { finish(); status.textContent = 'Результат збереження невизначений. Перевірте REPORTING; автоматичного повтору немає.'; };
        const timer = setTimeout(() => { settled = true; unknown(); }, 360000);
        try {
          google.script.run.withSuccessHandler((result) => {
            clearTimeout(timer); if (settled) return; settled = true; finish();
            if (result && ['OK', 'ALREADY_SAVED'].includes(result.status) && /^MC_\d{6,}$/.test(result.reportId) && /^https:\/\/docs\.google\.com\/spreadsheets\/d\/1Vy--GaVoUdP17Yd2PztUtXAcaf1krskxm5qvidQsoPc\/edit#gid=\d+$/.test(result.url)) {
              status.textContent = `${result.status === 'ALREADY_SAVED' ? 'Уже збережено' : 'Звіт збережено'}: ${result.reportId}`;
              link.href = result.url; link.hidden = false;
            } else if (result && result.status === 'ERROR') {
              status.textContent = `${result.code}: ${result.message || 'Збереження не виконано.'}`;
              if (result.code === 'STALE_CURRENT_REPORT') { currentReportSheetId = undefined; updateSaveReportButton(); }
            } else unknown();
          }).withFailureHandler(() => { clearTimeout(timer); if (settled) return; settled = true; unknown(); }).saveMaterialConsumptionReportWeb({ sourceSheetId });
        } catch (error) { clearTimeout(timer); settled = true; unknown(); }
      }
      loadCurrentReportState();
      const archiveBusy = new Set();
      let archiveListLoading = false;
      function refreshSavedReports() {
        if (archiveListLoading) return;
        archiveListLoading = true;
        document.getElementById('refreshArchiveButton').disabled = true;
        const status = document.getElementById('archiveStatus');
        status.textContent = 'Завантаження архіву...';
        const done = () => { archiveListLoading = false; document.getElementById('refreshArchiveButton').disabled = false; };
        google.script.run.withSuccessHandler(result => {
          done();
          if (!result || result.status !== 'OK') { status.textContent = `${result && result.code}: ${result && result.message}`; return; }
          const body = document.getElementById('savedReportsBody'); body.innerHTML = '';
          status.textContent = result.reports.length ? '' : 'Збережених звітів немає.';
          const date = value => value ? value.slice(0, 10).split('-').reverse().join('-') : '—';
          for (const report of result.reports) {
            const tr = document.createElement('tr');
            for (const value of [report.sheetName, report.houseCode, report.productCode, `${date(report.dateFrom)} — ${date(report.dateTo)}`, date(report.savedAt)]) {
              const td = document.createElement('td'); td.textContent = value; tr.appendChild(td);
            }
            const actions = document.createElement('td');
            if (report.state === 'ACTIVE' && /^https:\/\/docs\.google\.com\/spreadsheets\/d\/1Vy--GaVoUdP17Yd2PztUtXAcaf1krskxm5qvidQsoPc\/edit#gid=\d+$/.test(report.url)) {
              const open = document.createElement('a'); open.textContent = 'ВІДКРИТИ'; open.href = report.url; open.target = '_blank'; open.rel = 'noopener noreferrer'; actions.appendChild(open);
              const buttons = [];
              for (const action of ['rename', 'delete']) {
                const button = document.createElement('button'); button.textContent = action === 'rename' ? 'ПЕРЕЙМЕНУВАТИ' : 'ВИДАЛИТИ';
                button.disabled = archiveBusy.has(report.reportId);
                button.addEventListener('click', () => {
                  if (archiveBusy.has(report.reportId)) return;
                  let newName;
                  if (action === 'rename') { newName = prompt(`Нова назва ${report.reportId}`, report.sheetName); if (newName === null) return; }
                  if (!confirm(`${action === 'rename' ? 'Перейменувати' : 'Видалити'} «${report.sheetName}» (${report.reportId})?`)) return;
                  archiveBusy.add(report.reportId); buttons.forEach(b => { b.disabled = true; });
                  status.textContent = 'Виконання операції...'; let settled = false;
                  const finish = () => { archiveBusy.delete(report.reportId); buttons.forEach(b => { b.disabled = false; }); };
                  const unknown = () => { finish(); status.textContent = 'Результат невизначений. Перевірте REPORTING; автоматичного повтору немає.'; };
                  const timer = setTimeout(() => { settled = true; unknown(); }, 360000);
                  const runner = google.script.run.withSuccessHandler(result => {
                    clearTimeout(timer); if (settled) return; settled = true; finish();
                    if (result && result.status === 'OK') refreshSavedReports();
                    else status.textContent = `${result && result.code}: ${result && result.message}`;
                  }).withFailureHandler(() => { clearTimeout(timer); if (settled) return; settled = true; unknown(); });
                  if (action === 'rename') runner.renameSavedMaterialReportWeb({ reportId: report.reportId, sheetId: report.sheetId, newName });
                  else runner.deleteSavedMaterialReportWeb({ reportId: report.reportId, sheetId: report.sheetId });
                });
                buttons.push(button); actions.appendChild(button);
              }
            } else actions.textContent = report.diagnostic || 'Архів потребує перевірки.';
            tr.appendChild(actions); body.appendChild(tr);
          }
        }).withFailureHandler(() => { done(); status.textContent = 'Не вдалося завантажити архів. Повторної зміни не виконувалося.'; }).listSavedMaterialReportsWeb();
      }
      refreshSavedReports();
    </script>
  </body>
</html>
